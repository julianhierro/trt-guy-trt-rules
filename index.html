  var cfg = window.JV_EDITOR_EARLY || null;  // set just below, before this runs
  // Hold the paint only when the last visit found the store ahead of this file —

  // case (file is current) nothing is hidden and the page paints immediately.
  // Hold unless the last check proved THIS build is already current. Keyed by the

  window.__jvFreshKey = "jv-fresh:" + (cfg ? cfg.site : "");
  var stamp = window.JV_BAKED_AT || "none";
  var knownCurrent = false;
  try {
    var hasCache = !!localStorage.getItem("jv-edits:" + (cfg ? cfg.site : ""));
    // Cached edits mean this file is behind the published copy, whatever any
    // older freshness flag claims. Hold either way — the replay is synchronous.
    knownCurrent = !hasCache && localStorage.getItem(window.__jvFreshKey) === stamp;
  } catch (e) {}
  var release = function () { document.documentElement.classList.remove("jv-hold"); };
  window.__jvRelease = release;
  if (!knownCurrent) {
    document.documentElement.classList.add("jv-hold");

                                             // visit replays from cache and never holds at all

})();

/* ── Analytics ──────────────────────────────────────────────────────────

--------------------------------------------------------------------- */
var TRACK_URL = 'https://jv-dashboard-chi.vercel.app/api/pageview';
var PAGE_KEY  = 'trtdad-rules-gate';
function tdVisitor(){
  try {
    var k = 'td-vid', v = localStorage.getItem(k);
    if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(k, v); }

function tdUtm(){
  var keys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
  var sp = new URLSearchParams(location.search), store = {}, out = '', changed = false;
  try { store = JSON.parse(sessionStorage.getItem('td-utm') || '{}'); } catch (e) {}
  keys.forEach(function(k){ var v = sp.get(k); if (v) { store[k] = v; changed = true; } });
  if (changed) { try { sessionStorage.setItem('td-utm', JSON.stringify(store)); } catch (e) {} }
  keys.forEach(function(k){ if (store[k]) out += '&' + k + '=' + encodeURIComponent(store[k]); });
  return out;
}
function track(evt){
  var u = TRACK_URL + '?p=' + encodeURIComponent(PAGE_KEY) + '&e=' + evt +
          '&v=' + encodeURIComponent(tdVisitor()) + tdUtm();
  try { if (navigator.sendBeacon && navigator.sendBeacon(u)) return; } catch (e) {}
  try { new Image().src = u; } catch (e) {}
}

})();


/* ── The gate ─────────────────────────────────────────────────────────

var UNLOCK_KEY = 'hd-unlocked:' + MAGNET;
var ASSET = 'rules.html';

(function(){
  var form = document.getElementById('gateForm');
  if (!form) return;
  var err = form.querySelector('.err');
  var btn = form.querySelector('button[type=submit]');

  // Already opted in on this device? Don't make them do it twice.

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var name = form.first_name ? form.first_name.value.trim() : '';
    var email = form.email.value.trim();

<script>
(function () {
  if (!document.body) return;
  var SKIP = { SCRIPT:1, STYLE:1, NOSCRIPT:1, TEMPLATE:1, BR:1, LINK:1, META:1, HEAD:1 };
  var SVG = "http://www.w3.org/2000/svg";
  function skip(el) {
    return !!(SKIP[el.tagName]
      || (el.namespaceURI === SVG && el.tagName.toLowerCase() !== "svg")
      || (el.closest && el.closest(".jv-toolbar, .jv-launcher"))
      || (el.closest && el.closest("[data-noedit]")));
  }
  var n = 0;
  Array.prototype.forEach.call(document.body.querySelectorAll("*"), function (el) {
    if (skip(el)) return;
    if (!el.hasAttribute("data-eid")) el.setAttribute("data-eid", "e" + (++n));
  });
  var BLOCKSEL = "address,article,aside,blockquote,dd,details,div,dl,dt,fieldset,figcaption,figure,footer,form,h1,h2,h3,h4,h5,h6,header,hgroup,li,main,nav,ol,p,pre,section,summary,table,tbody,td,th,thead,tr,ul";
  function isTextLeaf(el) {
    if (skip(el)) return false;
    if (!(el.textContent || "").replace(/\s+/g, " ").trim()) return false;
    if (el.querySelector(BLOCKSEL)) return false;
    var anchors = el.querySelectorAll("a");
    if (anchors.length) {
      var clone = el.cloneNode(true);
      Array.prototype.forEach.call(clone.querySelectorAll("a"), function (a) { if (a.parentNode) a.parentNode.removeChild(a); });
      if (!(clone.textContent || "").replace(/\s+/g, " ").trim()) return false;
    }
    return true;
  }
  (function walk(el) {
    var c = el.children;
    for (var i = 0; i < c.length; i++) {
      var child = c[i];
      if (skip(child)) continue;
      if (isTextLeaf(child)) child.setAttribute("data-etext", "1");
      else walk(child);
    }
  })(document.body);
  Array.prototype.forEach.call(document.body.querySelectorAll("[data-eid]:not([data-etext])"), function (el) {
    if (skip(el) || el.closest("[data-etext]")) return;
    Array.prototype.slice.call(el.childNodes).forEach(function (node) {
      if (node.nodeType === 3 && node.nodeValue && node.nodeValue.replace(/\s+/g, " ").trim()) {
        var span = document.createElement("span");
        span.setAttribute("data-eid", "e" + (++n));
        span.setAttribute("data-etext", "1");
        node.parentNode.replaceChild(span, node);
        span.appendChild(node);
      }
    });
  });
})();

      else if (e.insert) inserts.push(e);
      else if (e.reorder) reorders.push(e);
      else if (e.removed && e.eid) removals.push(e.eid);
      else if (e.attrs && e.eid) attrs.push(e);
      else if (e.eid) patches.push(e);
    });
    patches.forEach(function (e) {
      var el = byEid(e.eid); if (!el) return;
      if (typeof e.html === "string") el.innerHTML = e.html;
      if (typeof e.style === "string") el.setAttribute("style", e.style);
    });
    inserts.forEach(function (e) {
      if (!e.id || typeof e.html !== "string" || byEid(e.id)) return;
      var tmp = document.createElement("div"); tmp.innerHTML = e.html.trim();
      var node = tmp.firstElementChild; if (!node) return;
      var after = byEid(e.afterEid), parent = byEid(e.parentEid);
      if (after && after.parentNode) after.parentNode.insertBefore(node, after.nextSibling);
      else if (parent) parent.appendChild(node);
    });
    reorders.forEach(function (e) {
      var c = byEid(e.eid); if (!c || !Array.isArray(e.order)) return;
      e.order.forEach(function (id) { var ch = byEid(id); if (ch && ch.parentElement === c) c.appendChild(ch); });
    });
    attrs.forEach(function (e) {
      var el = byEid(e.eid); if (!el) return;
      var gone = (e.attrs["-removed"] || "").split(",");
      Object.keys(e.attrs).forEach(function (k) {
        if (k === "-removed" || ATTR_OK.indexOf(k) === -1) return;
        el.setAttribute(k, e.attrs[k]);
      });
      gone.forEach(function (k) { if (k && ATTR_OK.indexOf(k) !== -1) el.removeAttribute(k); });
    });
    removals.forEach(function (id) { var el = byEid(id); if (el && el.parentNode) el.parentNode.removeChild(el); });
    if (css.length) {
      var sheet = "", media = { m: "@media (max-width:767px)", d: "@media (min-width:1024px)" };
      ["m", "d"].forEach(function (k) {
        var items = css.filter(function (c) { return c.d === k; });
        if (!items.length) return;
        sheet += media[k] + "{";
        items.forEach(function (c) {
          sheet += '[data-eid="' + c.eid + '"]{';
          Object.keys(c.props).forEach(function (p) { sheet += p + ":" + c.props[p] + " !important;"; });
          sheet += "}";
        });
        sheet += "}";
      });
      if (sheet) { var st = document.createElement("style"); st.textContent = sheet; document.head.appendChild(st); }
    }
  }

  // ── 1. replay the cached copy synchronously, before the browser paints ──
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE) || "null"); } catch (e) {}
  if (cached && Array.isArray(cached.edits) && (!baked || cached.updatedAt > baked)) {
    try { applyAll(cached.edits); } catch (e) {}
  }
  if (window.__jvRelease) window.__jvRelease();     // nothing left to wait for

  // ── 2. revalidate in the background; only touch the page if it changed ──
  (window.__jvFresh || Promise.resolve(null))
    .then(function (d) {
      if (!d || !d.updatedAt || !Array.isArray(d.edits)) return;
      var current = baked && d.updatedAt <= baked;
      try {
        if (current) { localStorage.setItem(window.__jvFreshKey, baked); localStorage.removeItem(CACHE); }
        else { localStorage.setItem(CACHE, JSON.stringify({ updatedAt: d.updatedAt, edits: d.edits })); }
      } catch (e) {}
      if (current) return;                          // the file is already right
      if (cached && cached.updatedAt === d.updatedAt) return;   // already replayed from cache
      applyAll(d.edits);
    })
    .catch(function () {})
    .then(function () { if (window.__jvRelease) window.__jvRelease(); });
})();
</script>
